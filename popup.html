<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n-doc-title="appTitleShort">GSC Backup</title>
    <style>
      body {
        font: 13px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 12px;
        width: 260px;
      }
      button {
        width: 100%;
        padding: 8px 10px;
        cursor: pointer;
      }
      .muted {
        color: #666;
        margin-top: 10px;
      }
      select {
        width: 100%;
        padding: 6px 8px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <button id="open" data-i18n="popupOpenDashboard">打开本地归档面板</button>
    <select id="lang" data-lang-select>
      <option value="zh-CN" data-i18n="languageZh">中文</option>
      <option value="ja" data-i18n="languageJa">日本語</option>
      <option value="en" data-i18n="languageEn">English</option>
    </select>
    <div class="muted" data-i18n="popupTagline">
      最小可行版：按月汇总归档（非官方）。
    </div>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
