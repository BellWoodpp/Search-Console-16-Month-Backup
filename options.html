<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n-doc-title="optionsTitle">GSC Backup 设置</title>
    <style>
      body {
        font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 20px;
        max-width: 700px;
      }
      label {
        display: block;
        margin: 10px 0 6px;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        box-sizing: border-box;
      }
      input[type="checkbox"] {
        width: auto;
      }
      select {
        width: 100%;
        padding: 8px 10px;
        box-sizing: border-box;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .row > * {
        flex: 1 1 auto;
      }
      .check {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 8px 0;
      }
      .card {
        border: 1px solid #e6e6e6;
        border-radius: 10px;
        padding: 12px;
        margin-top: 14px;
      }
      button {
        margin-top: 12px;
        padding: 8px 10px;
        cursor: pointer;
      }
      .muted {
        color: #666;
      }
      #autoStatus {
        white-space: pre-wrap;
      }
      pre {
        background: #f7f7f7;
        padding: 10px;
        border-radius: 8px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="optionsHeader">设置</h1>
    <div class="muted" data-i18n="optionsDesc">
      可选：填一个默认 Property（例如 https://example.com/ 或 sc-domain:example.com），面板会优先显示它。
    </div>

    <label for="lang"><span data-i18n="languageLabel">语言</span></label>
    <select id="lang" data-lang-select>
      <option value="zh-CN" data-i18n="languageZh">中文</option>
      <option value="ja" data-i18n="languageJa">日本語</option>
      <option value="en" data-i18n="languageEn">English</option>
    </select>

    <label for="defaultSiteUrl"
      ><span data-i18n="defaultSiteLabel">默认站点（Property）</span></label
    >
    <input id="defaultSiteUrl" placeholder="https://example.com/" />

    <div class="card">
      <h2 data-i18n="autoHeader">自动归档</h2>

      <label class="check">
        <input id="autoEnabled" type="checkbox" />
        <span data-i18n="autoEnabledLabel">启用自动归档</span>
      </label>

      <div class="row">
        <div style="min-width: 180px">
          <label for="autoTime"
            ><span data-i18n="autoTimeLabel">执行时间</span></label
          >
          <input id="autoTime" type="time" />
        </div>
      </div>

      <div>
        <div class="muted" style="margin: 8px 0" data-i18n="autoMonthsLabel">
          归档月份（可多选）
        </div>
        <div id="autoMonths" class="row"></div>
      </div>

      <label for="autoSitesMode"
        ><span data-i18n="autoSitesLabel">归档站点</span></label
      >
      <select id="autoSitesMode">
        <option value="default" data-i18n="autoSitesDefault">
          仅默认站点（使用上面的默认站点）
        </option>
        <option value="all" data-i18n="autoSitesAll">
          所有可访问站点（需要已授权）
        </option>
      </select>

      <h3 data-i18n="autoIncludeHeader">选择保存哪些数据</h3>

      <label class="check">
        <input id="incTotals" type="checkbox" />
        <span data-i18n="incTotals">按月汇总（totals）</span>
      </label>
      <label class="check">
        <input id="incQuery" type="checkbox" />
        <span data-i18n="incQuery">查询词（query，Top N）</span>
      </label>
      <label class="check">
        <input id="incPage" type="checkbox" />
        <span data-i18n="incPage">页面（page，Top N）</span>
      </label>
      <label class="check">
        <input id="incDevice" type="checkbox" />
        <span data-i18n="incDevice">设备（device）</span>
      </label>
      <label class="check">
        <input id="incCountry" type="checkbox" />
        <span data-i18n="incCountry">国家/地区（country，Top N）</span>
      </label>
      <label class="check">
        <input id="incSearchAppearance" type="checkbox" />
        <span data-i18n="incSearchAppearance">展现类型（searchAppearance，Top N）</span>
      </label>
      <label class="check">
        <input id="incDate" type="checkbox" />
        <span data-i18n="incDate">按天（date）</span>
      </label>

      <div class="row">
        <div style="min-width: 180px">
          <label for="maxRowsQuery"
            ><span data-i18n="maxRowsQueryLabel">query 最大行数</span></label
          >
          <input id="maxRowsQuery" type="number" min="1" max="10000" step="100" />
        </div>
        <div style="min-width: 180px">
          <label for="maxRowsPage"
            ><span data-i18n="maxRowsPageLabel">page 最大行数</span></label
          >
          <input id="maxRowsPage" type="number" min="1" max="10000" step="100" />
        </div>
        <div style="min-width: 180px">
          <label for="maxRowsCountry"
            ><span data-i18n="maxRowsCountryLabel">country 最大行数</span></label
          >
          <input
            id="maxRowsCountry"
            type="number"
            min="1"
            max="10000"
            step="100"
          />
        </div>
        <div style="min-width: 180px">
          <label for="maxRowsSearchAppearance"
            ><span data-i18n="maxRowsSearchAppearanceLabel"
              >searchAppearance 最大行数</span
            ></label
          >
          <input
            id="maxRowsSearchAppearance"
            type="number"
            min="1"
            max="10000"
            step="100"
          />
        </div>
      </div>

      <div class="muted" id="autoStatus"></div>
      <div class="row" style="margin-top: 10px">
        <button id="runNow" data-i18n="autoRunNow">立即执行一次</button>
      </div>

      <h3 data-i18n="autoExportHeader">自动导出到本地文件</h3>
      <label class="check">
        <input id="exportEnabled" type="checkbox" />
        <span data-i18n="autoExportEnabledLabel"
          >自动归档后导出为文件（下载到本机）</span
        >
      </label>
      <label for="exportFormat"
        ><span data-i18n="autoExportFormatLabel">导出格式</span></label
      >
      <select id="exportFormat">
        <option value="json">JSON</option>
      </select>
      <div class="row" style="margin-top: 10px">
        <button id="grantDownloads" data-i18n="autoExportGrantButton">
          授权文件保存（Downloads 权限）
        </button>
      </div>
      <div class="muted" data-i18n="autoExportNote">
        说明：文件会保存到浏览器下载目录（或你设置的下载位置）。
      </div>
    </div>

    <button id="save" data-i18n="saveButton">保存</button>
    <div id="status" class="muted" style="margin-top: 10px"></div>

    <h2 data-i18n="optionsHintHeader">提示</h2>
    <pre data-i18n-pre="optionsHintPre">
如果你还没配置 OAuth：
1) 先按 README 步骤在 GCP 创建 OAuth Client（Chrome Extension）
2) 把 client_id 填进 manifest.json 的 oauth2.client_id
3) 重新加载扩展
    </pre>
    <script src="i18n.js"></script>
    <script src="options.js"></script>
  </body>
</html>
